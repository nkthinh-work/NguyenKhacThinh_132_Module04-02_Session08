version: '3.8'

services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: quickbite-self-hosted-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/ThinhBanTo/quickbite-ci-demo
      RUNNER_NAME: quickbite-linux-runner
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted,Linux,X64
    volumes:
      # Mount Docker socket tu may host vao container Runner (Docker-outside-of-Docker - DooD)
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/runner:/tmp/runner
